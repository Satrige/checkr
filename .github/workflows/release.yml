name: release-binaries

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Glibc
          - target: x86_64-unknown-linux-gnu
            pkg: ""
            strip: "strip"
          # MUSL
          - target: x86_64-unknown-linux-musl
            pkg: "musl-tools"
            strip: "strip"

    steps:
      - uses: actions/checkout@v4

      - name: Install target deps
        run: |
          if [ -n "${{ matrix.pkg }}" ]; then sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}; fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        env:
          CARGO_TERM_COLOR: always
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          BIN="target/${{ matrix.target }}/release/checkr"
          if [ -f "$BIN" ]; then ${{ matrix.strip }} "$BIN" || true; fi

      - name: Package
        run: |
          BIN="target/${{ matrix.target }}/release/checkr"
          OUT="checkr-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist
          cp "$BIN" "dist/checkr"
          # Include README & LICENSE so the tarball is self-explanatory
          [ -f README.md ] && cp README.md dist/
          [ -f LICENSE* ] && cp LICENSE* dist/ || true
          tar -C dist -czf "${OUT}.tar.gz" .
          rm -rf dist
          sha256sum "${OUT}.tar.gz" > "${OUT}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            checkr-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            checkr-${{ github.ref_name }}-${{ matrix.target }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
